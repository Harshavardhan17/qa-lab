# Test profile: in-memory H2 (PostgreSQL-compatible mode) so the full Spring context,
# JPA mappings and the data seeder can be validated without Docker/Postgres.
spring:
  datasource:
    url: jdbc:h2:mem:bankqa;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-key-for-junit-only-0123456789-abcdefghijklmnop
  seed:
    enabled: true
